[package]
name = "osmpq-raw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "osmpq-raw"
path = "src/main.rs"

[dependencies]
osmpbf = "0.3"
arrow = "56"
parquet = "56"
rayon = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
debug = false
