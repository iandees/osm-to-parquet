[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmpq"
version = "0.0.1"
description = "Overpass QL over Parquet on object storage (M0 prototype)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5",
  "pyarrow>=17",
  "numpy",
  "fastapi",
  "uvicorn",
  "httpx",
  "boto3",
  # `osmpq.update.osc` (the replication `.osc.gz` parser M2 added) imports
  # this; missing from here until now, so a plain `pip install .` (e.g.
  # the service image, contract section 6.4) never actually pulled it in
  # -- it only worked in this sandbox because the system Python already
  # had it installed some other way.
  "osmium",
  "shapely>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
osmpq = "osmpq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
# Correctness (pyflakes) and the pycodestyle errors; style-only rules the
# codebase predates are left out on purpose.
select = ["E", "F"]
ignore = ["E501", "E702", "E741"]
